<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" style="max-width: 100%; height: auto" role="img" aria-labelledby="ss-t ss-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="ss-t">Squeezing scenario at high settles an attribute along scenario and drops the column and the property referring to it</title>
  <desc id="ss-d">The record's p_nom over entity and scenario holds gas NULL 50, gas high 70, wind NULL 100 and wind low 80. Selecting scenario equal to high drops wind low, which names another label, and settles gas along scenario alone, so gas high 70 replaces gas NULL 50. The selection's p_nom holds gas 70 and wind 100, without the scenario column. The entities' property scenario, NULL for gas and high for wind, goes with the dim, leaving entity and carrier.</desc>
  <defs>
    <marker id="ss-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="ss-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <path d="M16,54 V35 A3,3 0 0 1 19,32 H223 A3,3 0 0 1 226,35 V54 Z" fill="currentColor" fill-opacity="0.1"/>
    <rect x="16" y="54" width="210" height="18" fill="url(#ss-hatch)"/>
    <path d="M16,108 H226 V123 A3,3 0 0 1 223,126 H19 A3,3 0 0 1 16,123 Z" fill="url(#ss-hatch)"/>
    <path d="M16,190 V171 A3,3 0 0 1 19,168 H223 A3,3 0 0 1 226,171 V190 Z" fill="currentColor" fill-opacity="0.1"/>
    <path d="M500,54 V35 A3,3 0 0 1 503,32 H637 A3,3 0 0 1 640,35 V54 Z" fill="currentColor" fill-opacity="0.1"/>
    <path d="M500,190 V171 A3,3 0 0 1 503,168 H637 A3,3 0 0 1 640,171 V190 Z" fill="currentColor" fill-opacity="0.1"/>
    <rect x="500" y="258" width="14" height="14" fill="url(#ss-hatch)"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">record</text>
    <text x="68" y="22" fill-opacity="0.7">p_nom</text>
    <text x="16" y="158" font-weight="bold">record</text>
    <text x="68" y="158" fill-opacity="0.7">entity properties</text>
    <text x="500" y="22" font-weight="bold">selection</text>
    <text x="570" y="22" fill-opacity="0.7">p_nom</text>
    <text x="500" y="158" font-weight="bold">selection</text>
    <text x="570" y="158" fill-opacity="0.7">entity properties</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="46" font-weight="bold">entity</text>
      <text x="90" y="46" font-weight="bold">scenario</text>
      <text x="176" y="46" font-weight="bold">value</text>
      <text x="24" y="68">gas</text>
      <text x="90" y="68">NULL</text>
      <text x="176" y="68">50</text>
      <text x="24" y="86">gas</text>
      <text x="90" y="86">high</text>
      <text x="176" y="86">70</text>
      <text x="24" y="104">wind</text>
      <text x="90" y="104">NULL</text>
      <text x="176" y="104">100</text>
      <text x="24" y="122">wind</text>
      <text x="90" y="122">low</text>
      <text x="176" y="122">80</text>
      <text x="24" y="182" font-weight="bold">entity</text>
      <text x="90" y="182" font-weight="bold">carrier</text>
      <text x="160" y="182" font-weight="bold">scenario</text>
      <text x="24" y="204">gas</text>
      <text x="90" y="204">gas</text>
      <text x="160" y="204">NULL</text>
      <text x="24" y="222">wind</text>
      <text x="90" y="222">wind</text>
      <text x="160" y="222">high</text>
      <text x="508" y="46" font-weight="bold">entity</text>
      <text x="574" y="46" font-weight="bold">value</text>
      <text x="508" y="68">gas</text>
      <text x="574" y="68">70</text>
      <text x="508" y="86">wind</text>
      <text x="574" y="86">100</text>
      <text x="508" y="182" font-weight="bold">entity</text>
      <text x="574" y="182" font-weight="bold">carrier</text>
      <text x="508" y="204">gas</text>
      <text x="574" y="204">gas</text>
      <text x="508" y="222">wind</text>
      <text x="574" y="222">wind</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="210" height="94" rx="3"/>
    <line x1="16" y1="54" x2="226" y2="54"/>
    <rect x="16" y="168" width="210" height="58" rx="3"/>
    <line x1="16" y1="190" x2="226" y2="190"/>
    <rect x="500" y="32" width="140" height="58" rx="3"/>
    <line x1="500" y1="54" x2="640" y2="54"/>
    <rect x="500" y="168" width="140" height="58" rx="3"/>
    <line x1="500" y1="190" x2="640" y2="190"/>
    <path d="M226,43 H340 V179 H226"/>
    <path d="M500,43 H460 V179 H500"/>
    <rect x="500" y="258" width="14" height="14"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#ss-arrow)">
    <path d="M340,108 H452"/>
  </g>
  <g fill="currentColor">
    <text x="234" y="68" font-size="12" fill-opacity="0.7">settled</text>
    <text x="234" y="122" font-size="12" fill-opacity="0.7">names low</text>
    <text x="348" y="98" font-size="12" font-weight="bold">select</text>
    <text x="348" y="126" font-size="12" fill-opacity="0.7">scenario = high</text>
    <text x="652" y="68" font-size="12" fill-opacity="0.7">settled along</text>
    <text x="652" y="83" font-size="12" fill-opacity="0.7">scenario, no column</text>
    <text x="652" y="204" font-size="12" fill-opacity="0.7">property referring</text>
    <text x="652" y="219" font-size="12" fill-opacity="0.7">to scenario goes</text>
    <text x="520" y="269" font-size="12">dropped by the select</text>
  </g>
</svg>
