<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" style="max-width: 100%; height: auto" role="img" aria-labelledby="ss-t ss-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="ss-t">Squeezing snapshot at one label</title>
  <desc id="ss-d">The record's p_max_pu has rows for wind at snapshots 0, 1 and 2 and a row with entity and snapshot NULL. Squeezing snapshot at 1 drops the rows at snapshots 0 and 2, keeps the row at 1, settles the NULL row to snapshot 1, and drops the snapshot column: the selection contains wind 0.8 and entity NULL 1.0.</desc>
  <defs>
    <marker id="ss-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="ss-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <path d="M16,54 V35 A3,3 0 0 1 19,32 H213 A3,3 0 0 1 216,35 V54 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M16,54 H216 V72 H16 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,54 H216 V72 H16 Z" fill="url(#ss-hatch)"/>
    <path d="M16,72 H216 V90 H16 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,90 H216 V108 H16 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,90 H216 V108 H16 Z" fill="url(#ss-hatch)"/>
    <path d="M16,108 H216 V123 A3,3 0 0 1 213,126 H19 A3,3 0 0 1 16,123 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M476,54 V35 A3,3 0 0 1 479,32 H673 A3,3 0 0 1 676,35 V54 Z" fill="#009E73" fill-opacity="0.2"/>
    <path d="M476,54 H676 V72 H476 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M476,72 H676 V87 A3,3 0 0 1 673,90 H479 A3,3 0 0 1 476,87 Z" fill="#009E73" fill-opacity="0.08"/>
    <rect x="476" y="112" width="14" height="14" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="476" y="136" width="14" height="14" fill="#009E73" fill-opacity="0.2"/>
    <rect x="476" y="160" width="14" height="14" fill="url(#ss-hatch)"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">record</text>
    <text x="78" y="22" fill-opacity="0.75">p_max_pu</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="24" y="47" font-weight="bold">entity</text>
    <text x="88" y="47" font-weight="bold">snapshot</text>
    <text x="166" y="47" font-weight="bold">value</text>
    <text x="24" y="67">wind</text>
    <text x="88" y="67">0</text>
    <text x="166" y="67">0.3</text>
    <text x="24" y="85">wind</text>
    <text x="88" y="85">1</text>
    <text x="166" y="85">0.8</text>
    <text x="24" y="103">wind</text>
    <text x="88" y="103">2</text>
    <text x="166" y="103">0.5</text>
    <text x="24" y="121">NULL</text>
    <text x="88" y="121">NULL</text>
    <text x="166" y="121">1.0</text>
    </g>
    <text x="476" y="22" font-weight="bold">selection</text>
    <text x="562" y="22" fill-opacity="0.75">snapshot squeezed</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="484" y="47" font-weight="bold">entity</text>
    <text x="626" y="47" font-weight="bold">value</text>
    <text x="484" y="67">wind</text>
    <text x="626" y="67">0.8</text>
    <text x="484" y="85">NULL</text>
    <text x="626" y="85">1.0</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="200" height="94" rx="3"/>
    <line x1="16" y1="54" x2="216" y2="54"/>
    <rect x="476" y="32" width="200" height="58" rx="3"/>
    <line x1="476" y1="54" x2="676" y2="54"/>
    <rect x="476" y="112" width="14" height="14"/>
    <rect x="476" y="136" width="14" height="14"/>
    <rect x="476" y="160" width="14" height="14"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#ss-arrow)">
    <path d="M216,72 H468"/>
  </g>
  <g fill="currentColor">
    <text x="300" y="30" font-size="12" font-weight="bold">squeeze</text>
    <text x="300" y="46" font-size="12" fill-opacity="0.75">keep snapshot 1,</text>
    <text x="300" y="62" font-size="12" fill-opacity="0.75">drop the column</text>
    <text x="496" y="123" font-size="12">record read</text>
    <text x="496" y="147" font-size="12">selection</text>
    <text x="496" y="171" font-size="12">dropped by the selection</text>
  </g>
</svg>
