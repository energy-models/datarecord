<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" style="max-width: 100%; height: auto" role="img" aria-labelledby="lk-t lk-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="lk-t">A commit writes a parent's property into the child's axis file by label</title>
  <desc id="lk-d">The parent layer's snapshot axis contains snapshots 0, 1 and 3, with agg_3h 0, 0 and 3. The child source restates the snapshot axis as 0, 3 and 4, with no agg_3h column, so it removes snapshot 1 and adds snapshot 4. The commit writes the child layer's snapshot axis as 0, 3 and 4, with agg_3h 0, 3 and NULL. Snapshot 1 has no row, because the child removes it.</desc>
  <defs>
    <marker id="lk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="lk-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <path d="M16,54 V35 A3,3 0 0 1 19,32 H193 A3,3 0 0 1 196,35 V54 Z" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="16" y="54" width="180" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="16" y="72" width="180" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="16" y="72" width="180" height="18" fill="url(#lk-hatch)"/>
    <path d="M16,90 H196 V109 A3,3 0 0 1 193,112 H19 A3,3 0 0 1 16,109 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,182 V163 A3,3 0 0 1 19,160 H193 A3,3 0 0 1 196,163 V182 Z" fill="#E69F00" fill-opacity="0.2"/>
    <rect x="16" y="182" width="180" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="16" y="200" width="180" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M16,218 H196 V237 A3,3 0 0 1 193,240 H19 A3,3 0 0 1 16,237 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M556,54 V35 A3,3 0 0 1 559,32 H753 A3,3 0 0 1 756,35 V54 Z" fill="#009E73" fill-opacity="0.2"/>
    <rect x="556" y="54" width="88" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="644" y="54" width="112" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="556" y="90" width="88" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="644" y="90" width="112" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M556,108 H644 V130 H559 A3,3 0 0 1 556,127 Z" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="16" y="256" width="14" height="14" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="146" y="256" width="14" height="14" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="276" y="256" width="14" height="14" fill="#009E73" fill-opacity="0.2"/>
    <rect x="446" y="256" width="14" height="14" fill="url(#lk-hatch)"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">parent layer</text>
    <text x="104" y="22" fill-opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">dimensions/snapshot</text>
    <text x="24" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="112" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">agg_3h</text>
    <text x="24" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="112" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="24" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="112" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="24" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3</text>
    <text x="112" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3</text>
    <text x="16" y="150" font-weight="bold">child source</text>
    <text x="24" y="175" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="24" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="24" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3</text>
    <text x="24" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">4</text>
    <text x="556" y="22" font-weight="bold">child layer</text>
    <text x="640" y="22" fill-opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">dimensions/snapshot</text>
    <text x="564" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="652" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">agg_3h</text>
    <text x="564" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="652" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="568" y="86" font-style="italic" font-size="12">no row: 1 is removed</text>
    <text x="564" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3</text>
    <text x="652" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3</text>
    <text x="564" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">4</text>
    <text x="652" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">NULL</text>
    <text x="312" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">commit(source, parent=root)</text>
    <text x="312" y="118" font-size="12">carries agg_3h by label</text>
    <text x="36" y="267" font-size="12">parent layer</text>
    <text x="166" y="267" font-size="12">child source</text>
    <text x="296" y="267" font-size="12">written by the commit</text>
    <text x="466" y="267" font-size="12">removed</text>
    <text x="586" y="267" font-size="12">no row</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="180" height="80" rx="3"/>
    <line x1="16" y1="54" x2="196" y2="54"/>
    <rect x="16" y="160" width="180" height="80" rx="3"/>
    <line x1="16" y1="182" x2="196" y2="182"/>
    <rect x="560" y="74" width="192" height="15" rx="3" stroke-dasharray="4 3"/>
    <rect x="556" y="32" width="200" height="98" rx="3"/>
    <line x1="556" y1="54" x2="756" y2="54"/>
    <rect x="16" y="256" width="14" height="14"/>
    <rect x="146" y="256" width="14" height="14"/>
    <rect x="276" y="256" width="14" height="14"/>
    <rect x="446" y="256" width="14" height="14"/>
    <rect x="566" y="256" width="14" height="14" rx="2" stroke-dasharray="3 2"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2">
    <path d="M204,72 H300 V100"/>
    <path d="M204,200 H300 V100"/>
    <path d="M300,100 H548" marker-end="url(#lk-arrow)"/>
  </g>
</svg>
