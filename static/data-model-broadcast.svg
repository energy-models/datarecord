<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" style="max-width: 100%; height: auto" role="img" aria-labelledby="db-t db-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="db-t">Settling p_max_pu over its axes by the broadcast rule</title>
  <desc id="db-d">The attribute p_max_pu has four rows: wind at snapshots 0, 1 and 2 with 0.3, 0.8 and 0.5, and one row with entity and snapshot NULL and value 1.0. Settled over the entity axis wind, gas, dc and the snapshot axis 0, 1, 2, the result has one row per point: wind keeps its own three values, because a row that sets entity and snapshot is more specific than the NULL row, and gas and dc take 1.0 at every snapshot from the NULL row.</desc>
