[default.extend-words]
# PyPSA's own attribute name: fixed operation & maintenance cost.
fom = "fom"

[default]
# Heading anchors: mkdocs slugs drop apostrophes, e.g. "property's" -> "propertys".
# Pydantic's quoted errors cut `input_value` mid-word, e.g. "...onnection'".
extend-ignore-re = ["\\]\\([^)\\s]*#[a-z0-9-]+\\)", "input_value=.*input_type="]
