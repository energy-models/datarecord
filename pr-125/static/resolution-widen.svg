    <rect x="320" y="32" width="198" height="62" rx="3"/>
    <line x1="320" y1="54" x2="518" y2="54"/>
    <rect x="620" y="32" width="198" height="62" rx="3"/>
    <line x1="620" y1="54" x2="818" y2="54"/>
    <path d="M214,162 H596 V64"/>
    <rect x="320" y="120" width="14" height="14"/>
  </g>
