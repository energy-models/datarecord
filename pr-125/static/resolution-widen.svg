    <text x="390" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">high</text>
    <text x="472" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">root</text>
    <text x="526" y="86" fill-opacity="0.7" font-size="12">covered</text>
    <text x="620" y="22" font-weight="bold">read</text>
    <text x="666" y="22" fill-opacity="0.7">p_nom</text>
    <text x="628" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">entity</text>
    <text x="690" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">scenario</text>
    <text x="772" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">value</text>
    <text x="628" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">gas</text>
    <text x="690" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">low</text>
    <text x="772" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="628" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">gas</text>
    <text x="690" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">high</text>
    <text x="772" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3</text>
    <text x="224" y="56" font-weight="bold" font-size="12">split</text>
    <text x="560" y="56" font-weight="bold" font-size="12">fold</text>
    <text x="340" y="131" font-size="12">dropped by the fold</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="198" height="62" rx="3"/>
    <line x1="16" y1="54" x2="214" y2="54"/>
