    <path d="M16,162 H214 V181 A3,3 0 0 1 211,184 H19 A3,3 0 0 1 16,181 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M320,54 V35 A3,3 0 0 1 323,32 H515 A3,3 0 0 1 518,35 V54 Z" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="320" y="54" width="198" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M320,72 H518 V91 A3,3 0 0 1 515,94 H323 A3,3 0 0 1 320,91 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M320,72 H518 V91 A3,3 0 0 1 515,94 H323 A3,3 0 0 1 320,91 Z" fill="url(#rw-hatch)"/>
    <path d="M620,54 V35 A3,3 0 0 1 623,32 H815 A3,3 0 0 1 818,35 V54 Z" fill="#009E73" fill-opacity="0.2"/>
    <rect x="620" y="54" width="198" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M620,72 H818 V91 A3,3 0 0 1 815,94 H623 A3,3 0 0 1 620,91 Z" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="320" y="120" width="14" height="14" fill="url(#rw-hatch)"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">root layer</text>
    <text x="110" y="22" fill-opacity="0.7">partial {entity}</text>
    <text x="24" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">entity</text>
    <text x="86" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">scenario</text>
    <text x="168" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">value</text>
    <text x="24" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">gas</text>
