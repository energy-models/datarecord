<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" style="max-width: 100%; height: auto" role="img" aria-labelledby="lp-t lp-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="lp-t">A layer overrides one label along a dim in partial and restates the series along any other</title>
  <desc id="lp-d">With partial dims entity, the root writes p_max_pu for gas and wind at snapshots 0 and 1. The child changes wind at snapshot 1 to 0.9. It writes rows for wind alone, since entity is in partial, and restates wind's whole series, 0.5 and 0.9, since snapshot is not. The read takes gas from the root and wind from the child.</desc>
  <defs>
    <marker id="lp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="lp-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <path d="M16,54 V35 A3,3 0 0 1 19,32 H211 A3,3 0 0 1 214,35 V54 Z" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="16" y="54" width="198" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="16" y="72" width="198" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="16" y="90" width="198" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,108 H214 V127 A3,3 0 0 1 211,130 H19 A3,3 0 0 1 16,127 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,192 V173 A3,3 0 0 1 19,170 H211 A3,3 0 0 1 214,173 V192 Z" fill="#E69F00" fill-opacity="0.2"/>
    <rect x="16" y="192" width="198" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M16,210 H214 V229 A3,3 0 0 1 211,232 H19 A3,3 0 0 1 16,229 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M560,54 V35 A3,3 0 0 1 563,32 H755 A3,3 0 0 1 758,35 V54 Z" fill="#009E73" fill-opacity="0.2"/>
    <rect x="560" y="54" width="198" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="560" y="72" width="198" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="560" y="90" width="198" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M560,108 H758 V127 A3,3 0 0 1 755,130 H563 A3,3 0 0 1 560,127 Z" fill="#E69F00" fill-opacity="0.08"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">root layer</text>
    <text x="110" y="22" fill-opacity="0.7">p_max_pu</text>
    <text x="24" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">entity</text>
    <text x="86" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="168" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">value</text>
    <text x="24" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">gas</text>
    <text x="86" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="168" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.2</text>
    <text x="24" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">gas</text>
    <text x="86" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="168" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.3</text>
    <text x="24" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="86" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="168" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.5</text>
    <text x="24" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="86" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="168" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.6</text>
    <text x="16" y="160" font-weight="bold">child layer</text>
    <text x="118" y="160" fill-opacity="0.7">partial {entity}</text>
    <text x="24" y="185" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">entity</text>
    <text x="86" y="185" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="168" y="185" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">value</text>
    <text x="24" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="86" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="168" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.5</text>
    <text x="24" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="86" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="168" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.9</text>
    <text x="560" y="22" font-weight="bold">read</text>
    <text x="606" y="22" fill-opacity="0.7">p_max_pu</text>
    <text x="568" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">entity</text>
    <text x="630" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="712" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">value</text>
    <text x="568" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">gas</text>
    <text x="630" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="712" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.2</text>
    <text x="568" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">gas</text>
    <text x="630" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="712" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.3</text>
    <text x="568" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="630" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="712" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.5</text>
    <text x="568" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="630" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="712" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.9</text>
    <text x="310" y="92" font-weight="bold" font-size="12">fold</text>
    <text x="230" y="222" font-size="12">entity is in partial: the child writes wind alone.</text>
    <text x="230" y="238" font-size="12">snapshot is not: the child restates wind's whole series.</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="198" height="98" rx="3"/>
    <line x1="16" y1="54" x2="214" y2="54"/>
    <rect x="16" y="170" width="198" height="62" rx="3"/>
    <line x1="16" y1="192" x2="214" y2="192"/>
    <rect x="560" y="32" width="198" height="98" rx="3"/>
    <line x1="560" y1="54" x2="758" y2="54"/>
    <path d="M214,82 H300 V201 H214"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#lp-arrow)">
    <path d="M300,100 L552,100"/>
  </g>
</svg>
