<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 176" width="768" height="176" style="max-width: 100%; height: auto" role="img" aria-labelledby="rn-t rn-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="rn-t">A fold starts from the nearest fold at hand</title>
  <desc id="rn-d">The ancestry runs root, a, b, c, d, child. Node a is materialised on disk under resolved/, and node c is held by the workspace as shared tables. A record opened on child seeds its fold from c, the deepest node whose fold is at hand, and folds d onto it, then child. The root, a and b are not read.</desc>
  <defs>
    <marker id="rn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="none">
    <rect x="400" y="44" width="96" height="44" rx="3" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="528" y="44" width="96" height="44" rx="3" fill="#E69F00" fill-opacity="0.2"/>
    <rect x="656" y="44" width="96" height="44" rx="3" fill="#E69F00" fill-opacity="0.2"/>
    <rect x="116" y="146" width="14" height="14" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="404" y="146" width="14" height="14" fill="#E69F00" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="64.0" y="70.0" text-anchor="middle" fill-opacity="0.7">root</text>
    <text x="192.0" y="70.0" text-anchor="middle" fill-opacity="0.7">a</text>
    <text x="320.0" y="70.0" text-anchor="middle" fill-opacity="0.7">b</text>
    <text x="448.0" y="70.0" text-anchor="middle" font-weight="bold">c</text>
    <text x="576.0" y="70.0" text-anchor="middle" font-weight="bold">d</text>
    <text x="704.0" y="70.0" text-anchor="middle" font-weight="bold">child</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="44" width="96" height="44" rx="3"/>
    <rect x="144" y="44" width="96" height="44" rx="3" stroke-width="2.5"/>
    <path d="M112,66 H144"/>
    <rect x="272" y="44" width="96" height="44" rx="3"/>
    <path d="M240,66 H272"/>
    <rect x="400" y="44" width="96" height="44" rx="3" stroke-width="2.5"/>
    <path d="M368,66 H400"/>
    <rect x="528" y="44" width="96" height="44" rx="3"/>
    <rect x="656" y="44" width="96" height="44" rx="3"/>
    <path d="M16,96 V102 H368 V96"/>
    <rect x="16" y="146" width="14" height="14"/>
    <rect x="116" y="146" width="14" height="14"/>
    <rect x="404" y="146" width="14" height="14"/>
    <rect x="524" y="146" width="14" height="14" stroke-width="2.5"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#rn-arrow)">
    <path d="M498,66 H524"/>
    <path d="M626,66 H652"/>
  </g>
  <g fill="currentColor">
    <text x="512" y="58" font-size="12" fill-opacity="0.7" text-anchor="middle">fold</text>
    <text x="640" y="58" font-size="12" fill-opacity="0.7" text-anchor="middle">fold</text>
    <text x="192" y="30" font-size="12" text-anchor="middle">materialised</text>
    <text x="448" y="30" font-size="12" text-anchor="middle">shared tables</text>
    <text x="192" y="118" font-size="12" fill-opacity="0.7" text-anchor="middle">not read</text>
    <text x="36" y="157" font-size="12">not read</text>
    <text x="136" y="157" font-size="12">seed, a lower layer: the deepest fold at hand</text>
    <text x="424" y="157" font-size="12">folded now</text>
    <text x="544" y="157" font-size="12">fold at hand</text>
  </g>
</svg>
