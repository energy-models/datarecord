<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" style="max-width: 100%; height: auto" role="img" aria-labelledby="rr-t rr-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="rr-t">The read joins the owning layers' value files to the owner map keyed as stored</title>
  <desc id="rr-d">The value files of p_nom hold the root's gas NULL 50 and wind NULL 100 and the child's NULL high 999. The owner map, keyed as its owning layer stored each key, holds the root's two rows and three child rows, all keyed NULL high: the child's own row and the overlap rows gas high and wind high, which carry their entity beside the stored NULL. One NULL-safe hash join on layer, entity and scenario matches the child's stored NULL to all three, and the read returns five owned rows: gas NULL 50, wind NULL 100, NULL high 999, gas high 999 and wind high 999.</desc>
