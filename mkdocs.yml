site_name: datarecord
site_description: Dimensioned attribute data with a declared schema
site_url: https://energy-models.github.io/datarecord/
repo_url: https://github.com/energy-models/datarecord
repo_name: energy-models/datarecord
edit_uri: edit/main/docs/
strict: true

validation:
  # Under `strict: true` a warning fails the build, which is the point: a page
  # added without a nav entry, or a cross-reference that stopped resolving after
  # a section was renamed, fails CI rather than shipping as a dead link.
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials:
      - tutorials/index.md
      - tutorials/first-record.md
      - tutorials/scenario.md
      - tutorials/pypsa.md
  - How-to guides:
      - howto/index.md
      - howto/declare-a-schema.md
      - howto/read-a-record.md
      - howto/select-a-view.md
      - howto/edit-a-record.md
      - howto/branch-and-materialise.md
      - howto/store-a-record.md
      - howto/use-the-pypsa-tool.md
      - howto/present-a-framework-object.md
  - Reference:
      - reference/index.md
      - reference/data-model.md
      - reference/schema.md
      - reference/record.md
      - reference/selecting.md
      - reference/editing.md
      - reference/layers.md
      - reference/resolution.md
      - reference/format.md
      - reference/store.md
      - reference/tools.md
      - reference/glossary.md
      - API:
          - reference/api/index.md
          - reference/api/schema.md
          - reference/api/record.md
          - reference/api/mutable.md
          - reference/api/store.md
          - reference/api/tools.md
  - About:
      - about/index.md
      - about/one-record.md
      - about/data-model.md
      - about/layers.md
      - about/storage.md
      - about/open-questions.md
  - Development:
      - development/index.md
      - development/contributing.md
      - development/package.md
      - Enhancement proposals:
          - development/proposals/index.md
          - Template: development/proposals/dep-NNNN-template.md
          - "DEP 1: dims, mappings, groups and traits": development/proposals/dep-0001-dims-groups-traits.md
          - "DEP 2: groups, one construct for classification and sparsity": development/proposals/dep-0002-groups.md
          - "DEP 3: trait switches, a trait a component opts into": development/proposals/dep-0003-trait-switches.md
          - "DEP 4: staging as a layer, one fold, two sources": development/proposals/dep-0004-staging-as-a-layer.md
          - "DEP 5: one `Record`, over a `NodeCache`": development/proposals/dep-0005-one-record-over-a-node-cache.md
          - "DEP 6: a member file contains values, and nothing else": development/proposals/dep-0006-a-member-file-holds-values.md
          - "DEP 7: staging without `_seq`": development/proposals/dep-0007-staging-without-seq.md
          - "DEP 8: one interface over two objects: a source returns its own rows, and a fold returns the resolved rows": development/proposals/dep-0008-one-interface-source-and-fold.md
          - "DEP 9: a `Workspace` holds the connection, a `Store` holds a location": development/proposals/dep-0009-store.md
          - "DEP 10: a group is one struct column": development/proposals/dep-0010-a-group-is-a-struct-column.md
          - "DEP 11: deletion cascades through tombstones, not through filters": development/proposals/dep-0011-deletion-cascades-through-tombstones.md
          - "DEP 12: properties, metadata declared apart from data": development/proposals/dep-0012-properties.md
          - "DEP 13: buses and carriers are dims": development/proposals/dep-0013-buses-and-carriers-are-dims.md
          - "DEP 14: combining a record with an extension": development/proposals/dep-0014-combining-records.md
          - "DEP 15: a dim is flat": development/proposals/dep-0015-a-dim-is-flat.md
          - "DEP 16: remove traits": development/proposals/dep-0016-remove-traits.md
          - "DEP 17: results are attributes": development/proposals/dep-0017-results-are-attributes.md
          - "DEP 18: drop narwhals": development/proposals/dep-0018-drop-narwhals.md
          - "DEP 19: one Record and a package layout": development/proposals/dep-0019-one-record-and-a-package-layout.md
          - "DEP 20: a layer restates an axis whole": development/proposals/dep-0020-a-layer-restates-an-axis-whole.md
          - "DEP 21: the owner map contains keys as written": development/proposals/dep-0021-the-owner-map-holds-keys-as-written.md
          - "DEP 22: a layer restates membership whole": development/proposals/dep-0022-a-layer-restates-membership-whole.md
          - "DEP 23: multi-dims replace groups": development/proposals/dep-0023-multi-dims.md
          - "DEP 24: categories are enum dimensions": development/proposals/dep-0024-categories-are-enum-dimensions.md
          - "DEP 25: each layer has its own manifest": development/proposals/dep-0025-a-layer-carries-its-manifest.md
          - "DEP 26: the fold reads each layer under its own schema": development/proposals/dep-0026-the-fold-reads-each-layer-under-its-own-schema.md
          - "DEP 31: `select` returns a view of a record's labels": development/proposals/dep-0031-a-record-selects-a-view.md
          - "DEP 33: the fold is a fixed plan": development/proposals/dep-0033-the-fold-is-a-fixed-plan.md
          - "DEP 34: `register` creates one view per relation": development/proposals/dep-0034-a-record-registers-as-views.md
          - "DEP 35: the workspace keeps the tables a record reads": development/proposals/dep-0035-a-record-holds-the-tables-it-reads.md
          - "DEP 37: a working record widens its schema": development/proposals/dep-0037-a-working-record-widens-its-schema.md
  - Changelog: changelog.md

theme:
  name: material
  language: en

  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

