<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 300" width="790" height="300" style="max-width: 100%; height: auto" role="img" aria-labelledby="rw-t rw-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="rw-t">Splitting the parent's rows by their labels when a dim joins partial</title>
  <desc id="rw-d">The root, under partial entity, writes gas low 1 and gas high 2 along scenario. The child, under partial entity and scenario, writes gas high 3. Extending the root's map row with a NULL scenario keeps the root as owner of gas NULL, which joins no root row, since none is stored NULL along scenario: the read loses gas low. Splitting the root's row by the labels the root wrote gives gas low and gas high, owned by the root; the child's gas high covers the second, which the fold drops, and the read gives gas low 1 and gas high 3.</desc>
