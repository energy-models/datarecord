    <path d="M16,212 H216 V227 A3,3 0 0 1 213,230 H19 A3,3 0 0 1 16,227 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,212 H216 V227 A3,3 0 0 1 213,230 H19 A3,3 0 0 1 16,227 Z" fill="url(#sp-hatch)"/>
    <path d="M476,54 V35 A3,3 0 0 1 479,32 H593 A3,3 0 0 1 596,35 V54 Z" fill="#009E73" fill-opacity="0.2"/>
