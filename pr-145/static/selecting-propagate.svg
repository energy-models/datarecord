<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" style="max-width: 100%; height: auto" role="img" aria-labelledby="sp-t sp-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="sp-t">Dropping a bus drops the connections that contain it</title>
  <desc id="sp-d">Selecting the bus north drops the bus south. The connection axis lists wind north, gas south, dc north and dc south, and the tuples gas south and dc south go with the dropped label. The selection keeps the bus north and the connections wind north and dc north. The entity axis keeps wind, gas and dc, because nothing flows back from a dropped tuple to the labels in it.</desc>
