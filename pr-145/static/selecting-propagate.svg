  <g fill="currentColor">
    <text x="300" y="53" font-size="12" font-weight="bold">keep north</text>
    <text x="300" y="159" font-size="12" font-weight="bold">drop the tuples</text>
    <text x="300" y="175" font-size="12" fill-opacity="0.75">that contain south</text>
    <text x="476" y="246" font-size="12" fill-opacity="0.75">entity keeps wind, gas and dc</text>
    <text x="36" y="273" font-size="12">record read</text>
