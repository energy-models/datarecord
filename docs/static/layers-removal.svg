  <title id="lr-t">Removing a label removes its values and the tuples that contain it</title>
  <desc id="lr-d">The root contains the entity axis gas, wind, coal, the connection tuples gas north and coal north, and p_nom for all three entities. The child restates the entity axis as gas and wind, and the connection axis as gas north. It writes no p_nom file. The read has no coal label, no coal north tuple and no p_nom row for coal.</desc>
