<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" width="700" height="150" style="max-width: 100%; height: auto" role="img" aria-labelledby="rd-t rd-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="rd-t">Reading a directory as a fold over one layer</title>
  <desc id="rd-d">The directory out contains manifest.json, dims and attributes, the layout of one layer. Read with ws.at, it is a fold over that one layer, so the owner map assigns every map row to that layer.</desc>
  <defs>
    <marker id="rd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="rd-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <rect x="16" y="40" width="170" height="64" rx="3" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M400,62 V43 A3,3 0 0 1 403,40 H595 A3,3 0 0 1 598,43 V62 Z" fill="#009E73" fill-opacity="0.2"/>
    <rect x="400" y="62" width="198" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M400,80 H598 V99 A3,3 0 0 1 595,102 H403 A3,3 0 0 1 400,99 Z" fill="#0072B2" fill-opacity="0.08"/>
  </g>
  <g fill="currentColor">
    <text x="24" y="69.0" font-weight="bold">out/</text>
    <text x="24" y="85.0" fill-opacity="0.7" font-size="12">manifest.json, dims/,</text>
    <text x="24" y="96" fill-opacity="0.7" font-size="12">attributes/</text>
    <text x="400" y="30" font-weight="bold">owner map</text>
    <text x="408" y="55" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">entity</text>
    <text x="470" y="55" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">scenario</text>
    <text x="552" y="55" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">layer</text>
    <text x="408" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">gas</text>
    <text x="470" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">NULL</text>
    <text x="552" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">out</text>
    <text x="408" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="470" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">NULL</text>
    <text x="552" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">out</text>
    <text x="196" y="64" font-weight="bold" font-size="12">ws.at("out/")</text>
    <text x="196" y="90" fill-opacity="0.7" font-size="12">a fold over one layer</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="40" width="170" height="64" rx="3"/>
    <rect x="400" y="40" width="198" height="62" rx="3"/>
    <line x1="400" y1="62" x2="598" y2="62"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#rd-arrow)">
    <path d="M186,72 L392,72"/>
  </g>
</svg>
