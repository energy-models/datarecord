<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" style="max-width: 100%; height: auto" role="img" aria-labelledby="rf-t rf-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="rf-t">One layer folds onto its parent's owner map</title>
  <desc id="rf-d">With partial dims entity and scenario, the parent's owner map holds the root's rows gas NULL, wind NULL and coal NULL. The child removes coal and writes gas NULL 60, NULL high 999 and the row naming both, gas high 999. The fold prunes the root's coal row, which names the removed label, drops the root's gas row, which the child's gas NULL covers, and adds the child's three rows and one overlap row, wind high, owned by the child, where the root's wind NULL crosses the child's NULL high.</desc>
  <defs>
    <marker id="rf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="rf-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <path d="M16,54 V35 A3,3 0 0 1 19,32 H223 A3,3 0 0 1 226,35 V54 Z" fill="currentColor" fill-opacity="0.1"/>
    <rect x="16" y="54" width="210" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="16" y="54" width="210" height="18" fill="url(#rf-hatch)"/>
    <rect x="16" y="72" width="210" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,90 H226 V109 A3,3 0 0 1 223,112 H19 A3,3 0 0 1 16,109 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,90 H226 V109 A3,3 0 0 1 223,112 H19 A3,3 0 0 1 16,109 Z" fill="url(#rf-hatch)"/>
    <path d="M16,190 V171 A3,3 0 0 1 19,168 H223 A3,3 0 0 1 226,171 V190 Z" fill="#E69F00" fill-opacity="0.2"/>
    <rect x="16" y="190" width="210" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="16" y="208" width="210" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M16,226 H226 V245 A3,3 0 0 1 223,248 H19 A3,3 0 0 1 16,245 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M500,54 V35 A3,3 0 0 1 503,32 H707 A3,3 0 0 1 710,35 V54 Z" fill="currentColor" fill-opacity="0.1"/>
    <rect x="500" y="54" width="210" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="500" y="72" width="210" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="500" y="90" width="210" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="500" y="108" width="210" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M500,126 H710 V145 A3,3 0 0 1 707,148 H503 A3,3 0 0 1 500,145 Z" fill="#E69F00" fill-opacity="0.35"/>
    <rect x="500" y="186" width="14" height="14" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="500" y="210" width="14" height="14" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="500" y="234" width="14" height="14" fill="#E69F00" fill-opacity="0.35"/>
    <rect x="500" y="258" width="14" height="14" fill="url(#rf-hatch)"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">parent map</text>
    <text x="106" y="22" fill-opacity="0.7">p_nom</text>
    <text x="16" y="158" font-weight="bold">child layer</text>
    <text x="114" y="158" fill-opacity="0.7">p_nom, removes coal</text>
    <text x="500" y="22" font-weight="bold">owner map</text>
    <text x="582" y="22" fill-opacity="0.7">after the fold</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="46" font-weight="bold">entity</text>
      <text x="90" y="46" font-weight="bold">scenario</text>
      <text x="176" y="46" font-weight="bold">layer</text>
      <text x="24" y="68">gas</text>
      <text x="90" y="68">NULL</text>
      <text x="176" y="68">root</text>
      <text x="24" y="86">wind</text>
      <text x="90" y="86">NULL</text>
      <text x="176" y="86">root</text>
      <text x="24" y="104">coal</text>
