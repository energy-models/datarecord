    <text x="508" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">NULL</text>
    <text x="574" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">high</text>
