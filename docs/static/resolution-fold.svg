    <text x="660" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">layer</text>
    <text x="508" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
