      <text x="176" y="104">root</text>
      <text x="24" y="182" font-weight="bold">entity</text>
      <text x="90" y="182" font-weight="bold">scenario</text>
      <text x="176" y="182" font-weight="bold">value</text>
      <text x="24" y="204">gas</text>
