      <text x="90" y="222">high</text>
      <text x="176" y="222">999</text>
      <text x="24" y="240">gas</text>
      <text x="90" y="240">high</text>
      <text x="176" y="240">999</text>
      <text x="508" y="46" font-weight="bold">entity</text>
      <text x="574" y="46" font-weight="bold">scenario</text>
      <text x="660" y="46" font-weight="bold">layer</text>
      <text x="508" y="68">wind</text>
      <text x="574" y="68">NULL</text>
      <text x="660" y="68">root</text>
      <text x="508" y="86">gas</text>
      <text x="574" y="86">NULL</text>
      <text x="660" y="86">child</text>
      <text x="508" y="104">NULL</text>
      <text x="574" y="104">high</text>
      <text x="660" y="104">child</text>
      <text x="508" y="122">gas</text>
      <text x="574" y="122">high</text>
      <text x="660" y="122">child</text>
      <text x="508" y="140">wind</text>
      <text x="574" y="140">high</text>
      <text x="660" y="140">child</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="210" height="80" rx="3"/>
    <line x1="16" y1="54" x2="226" y2="54"/>
    <rect x="16" y="168" width="210" height="80" rx="3"/>
    <line x1="16" y1="190" x2="226" y2="190"/>
    <rect x="500" y="32" width="210" height="116" rx="3"/>
    <line x1="500" y1="54" x2="710" y2="54"/>
    <path d="M226,43 H340 V179 H226"/>
    <path d="M716,131 H722 V145 H716"/>
    <rect x="500" y="186" width="14" height="14"/>
    <rect x="500" y="210" width="14" height="14"/>
    <rect x="500" y="234" width="14" height="14"/>
    <rect x="500" y="258" width="14" height="14"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#rf-arrow)">
    <path d="M340,108 H492"/>
  </g>
  <g fill="currentColor">
    <text x="234" y="68" font-size="12" fill-opacity="0.7">covered</text>
    <text x="234" y="104" font-size="12" fill-opacity="0.7">removed</text>
    <text x="352" y="98" font-size="12" font-weight="bold">fold</text>
    <text x="352" y="126" font-size="12" fill-opacity="0.7">prune, drop covered,</text>
    <text x="352" y="141" font-size="12" fill-opacity="0.7">add rows, overlaps</text>
    <text x="728" y="142" font-size="12">overlap</text>
    <text x="520" y="197" font-size="12">root layer</text>
    <text x="520" y="221" font-size="12">child layer</text>
    <text x="520" y="245" font-size="12">overlap row</text>
    <text x="520" y="269" font-size="12">dropped by the fold</text>
  </g>
</svg>
