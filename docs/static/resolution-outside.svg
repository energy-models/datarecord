<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 196" width="780" height="196" style="max-width: 100%; height: auto" role="img" aria-labelledby="ru-t ru-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="ru-t">A child that leaves a dim outside partial NULL is written along the parent's labels</title>
  <desc id="ru-d">With partial dims entity alone, the root writes p_max_pu over snapshot for every entity: NULL 0 0.2 and NULL 1 0.5. The edit sets wind to 0.9 with snapshot NULL. store.commit writes the child layer as wind NULL, wind 0 and wind 1, all 0.9, so the child's rows set every dim that the root's rows set. The fold refuses a layer with the first row alone.</desc>
  <defs>
    <marker id="ru-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="ru-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <path d="M16,54 V35 A3,3 0 0 1 19,32 H211 A3,3 0 0 1 214,35 V54 Z" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="16" y="54" width="198" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,72 H214 V91 A3,3 0 0 1 211,94 H19 A3,3 0 0 1 16,91 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,172 V153 A3,3 0 0 1 19,150 H211 A3,3 0 0 1 214,153 V172 Z" fill="#E69F00" fill-opacity="0.2"/>
    <path d="M16,172 H214 V191 A3,3 0 0 1 211,194 H19 A3,3 0 0 1 16,191 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M330,54 V35 A3,3 0 0 1 333,32 H525 A3,3 0 0 1 528,35 V54 Z" fill="#E69F00" fill-opacity="0.2"/>
    <rect x="330" y="54" width="198" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="330" y="72" width="198" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M330,90 H528 V109 A3,3 0 0 1 525,112 H333 A3,3 0 0 1 330,109 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M570,54 V35 A3,3 0 0 1 573,32 H713 A3,3 0 0 1 716,35 V54 Z" fill="#009E73" fill-opacity="0.2"/>
    <rect x="570" y="54" width="146" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M570,72 H716 V91 A3,3 0 0 1 713,94 H573 A3,3 0 0 1 570,91 Z" fill="#E69F00" fill-opacity="0.08"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">root layer</text>
    <text x="110" y="22" fill-opacity="0.7">p_max_pu</text>
    <text x="24" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">entity</text>
    <text x="86" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="168" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">value</text>
    <text x="24" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">NULL</text>
    <text x="86" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="168" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.2</text>
    <text x="24" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">NULL</text>
    <text x="86" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="168" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.5</text>
    <text x="16" y="140" font-weight="bold">edit</text>
    <text x="62" y="140" fill-opacity="0.7">set(..., entity="wind")</text>
    <text x="24" y="165" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">entity</text>
    <text x="86" y="165" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="168" y="165" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">value</text>
    <text x="24" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="86" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">NULL</text>
    <text x="168" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.9</text>
    <text x="330" y="22" font-weight="bold">child layer</text>
    <text x="432" y="22" fill-opacity="0.7">as written</text>
    <text x="338" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">entity</text>
    <text x="400" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="482" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">value</text>
    <text x="338" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="400" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">NULL</text>
    <text x="482" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.9</text>
    <text x="338" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="400" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="482" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.9</text>
    <text x="338" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">wind</text>
    <text x="400" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="482" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.9</text>
    <text x="570" y="22" font-weight="bold">read</text>
    <text x="616" y="22" fill-opacity="0.7">wind</text>
    <text x="578" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">snapshot</text>
    <text x="660" y="47" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">value</text>
    <text x="578" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0</text>
    <text x="660" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.9</text>
    <text x="578" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1</text>
    <text x="660" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">0.9</text>
    <text x="280" y="74" font-weight="bold" font-size="12">commit</text>
    <text x="330" y="150" font-size="12">A layer with the first row alone:</text>
    <text x="330" y="166" font-size="12">the fold refuses it.</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="198" height="62" rx="3"/>
    <line x1="16" y1="54" x2="214" y2="54"/>
    <rect x="16" y="150" width="198" height="44" rx="3"/>
    <line x1="16" y1="172" x2="214" y2="172"/>
    <rect x="330" y="32" width="198" height="80" rx="3"/>
    <line x1="330" y1="54" x2="528" y2="54"/>
    <rect x="570" y="32" width="146" height="62" rx="3"/>
    <line x1="570" y1="54" x2="716" y2="54"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#ru-arrow)">
    <path d="M214,172 L270,172 L270,82 L322,82"/>
    <path d="M528,82 L562,82"/>
  </g>
</svg>
