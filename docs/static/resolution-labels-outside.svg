    <path d="M216,72 H552"/>
    <path d="M108,190 H282"/>
  </g>
  <g fill="currentColor">
    <text x="240" y="30" font-size="12" font-weight="bold">read</text>
    <text x="240" y="46" font-size="12" fill-opacity="0.75">keeps the root's rows,</text>
    <text x="240" y="62" font-size="12" fill-opacity="0.75">drops snapshot 2</text>
    <text x="124" y="166" font-size="12" font-weight="bold">restate</text>
    <text x="124" y="182" font-size="12" fill-opacity="0.75">without 2</text>
    <text x="298" y="237" font-size="12">no p_max_pu file</text>
    <text x="580" y="161" font-size="12">root layer</text>
    <text x="580" y="185" font-size="12">child layer</text>
    <text x="580" y="209" font-size="12">read</text>
    <text x="580" y="233" font-size="12">removed label, dropped row</text>
