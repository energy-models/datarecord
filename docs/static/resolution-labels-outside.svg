    <rect x="560" y="174" width="14" height="14" fill="#E69F00" fill-opacity="0.2"/>
    <rect x="560" y="198" width="14" height="14" fill="#009E73" fill-opacity="0.2"/>
    <rect x="560" y="222" width="14" height="14" fill="url(#rx-hatch)"/>
