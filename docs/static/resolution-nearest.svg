<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" width="780" height="170" style="max-width: 100%; height: auto" role="img" aria-labelledby="rn-t rn-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="rn-t">A fold starts from the nearest fold at hand</title>
  <desc id="rn-d">The ancestry runs root, a, b, c, d, child. Revision a is materialised on disk, and the workspace keeps the fold of c as tables. For a record opened on child, the fold starts from c, the deepest fold at hand, and folds d and then child onto it. Root, a and b are not read.</desc>
  <defs>
    <marker id="rn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="rn-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <rect x="136" y="50" width="100" height="44" rx="3" fill="#009E73" fill-opacity="0.2"/>
    <rect x="376" y="50" width="120" height="44" rx="3" fill="#009E73" fill-opacity="0.2"/>
    <rect x="516" y="50" width="110" height="44" rx="3" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="646" y="50" width="110" height="44" rx="3" fill="#E69F00" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="24" y="69.0" fill-opacity="0.7">root</text>
    <text x="24" y="85.0" fill-opacity="0.7" font-size="12">not read</text>
    <text x="144" y="69.0" font-weight="bold">a</text>
    <text x="144" y="85.0" fill-opacity="0.7" font-size="12">materialised</text>
    <text x="264" y="69.0" fill-opacity="0.7">b</text>
    <text x="264" y="85.0" fill-opacity="0.7" font-size="12">not read</text>
    <text x="384" y="69.0" font-weight="bold">c</text>
    <text x="384" y="85.0" fill-opacity="0.7" font-size="12">fold held</text>
    <text x="524" y="69.0" font-weight="bold">d</text>
    <text x="524" y="85.0" fill-opacity="0.7" font-size="12">parent layer</text>
    <text x="654" y="69.0" font-weight="bold">child</text>
    <text x="654" y="85.0" fill-opacity="0.7" font-size="12">child layer</text>
    <text x="376" y="136" font-size="12">the fold: seeded from c, then folds d, then child</text>
    <text x="16" y="30" fill-opacity="0.7" font-size="12">parent to child</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="50" width="100" height="44" rx="3" stroke-opacity="0.5"/>
    <rect x="136" y="50" width="100" height="44" rx="3"/>
    <rect x="256" y="50" width="100" height="44" rx="3" stroke-opacity="0.5"/>
    <rect x="376" y="50" width="120" height="44" rx="3"/>
    <rect x="516" y="50" width="110" height="44" rx="3"/>
    <rect x="646" y="50" width="110" height="44" rx="3"/>
    <path d="M376,108 V116 H756 V108"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#rn-arrow)">
    <path d="M116,72 L134,72"/>
    <path d="M236,72 L254,72"/>
    <path d="M356,72 L374,72"/>
    <path d="M496,72 L514,72"/>
    <path d="M626,72 L644,72"/>
  </g>
</svg>
