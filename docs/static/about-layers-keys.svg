<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" style="max-width: 100%; height: auto" role="img" aria-labelledby="alk-t alk-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="alk-t">An owner map that expands a broadcast against one that keeps it as written</title>
  <desc id="alk-d">The parent layer writes p_nom with entity NULL and value 50. The child layer restates the entity axis as gas, wind and solar, adding solar. An owner map that expands the parent's broadcast contains one row per label that the broadcast applied to when it was folded, gas and wind, both assigned to the parent, and has no row for solar, which came after that fold. An owner map that keeps the map row as written contains one row, entity NULL, assigned to the parent, and NULL means gas, wind and solar.</desc>
  <defs>
    <marker id="alk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="none">
    <path d="M16,54 V35 A3,3 0 0 1 19,32 H213 A3,3 0 0 1 216,35 V54 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M16,54 H216 V73 A3,3 0 0 1 213,76 H19 A3,3 0 0 1 16,73 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,160 V141 A3,3 0 0 1 19,138 H213 A3,3 0 0 1 216,141 V160 Z" fill="#E69F00" fill-opacity="0.2"/>
    <rect x="16" y="160" width="200" height="44" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M16,204 H216 V223 A3,3 0 0 1 213,226 H19 A3,3 0 0 1 16,223 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M470,54 V35 A3,3 0 0 1 473,32 H697 A3,3 0 0 1 700,35 V54 Z" fill="#009E73" fill-opacity="0.2"/>
    <rect x="470" y="54" width="230" height="22" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M470,76 H700 V95 A3,3 0 0 1 697,98 H473 A3,3 0 0 1 470,95 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M470,182 V163 A3,3 0 0 1 473,160 H697 A3,3 0 0 1 700,163 V182 Z" fill="#009E73" fill-opacity="0.2"/>
    <path d="M470,182 H700 V201 A3,3 0 0 1 697,204 H473 A3,3 0 0 1 470,201 Z" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="16" y="258" width="14" height="14" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="136" y="258" width="14" height="14" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="256" y="258" width="14" height="14" fill="#009E73" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">parent layer</text>
    <text x="110" y="22" fill-opacity="0.7">p_nom</text>
    <text x="16" y="128" font-weight="bold">child layer</text>
    <text x="102" y="128" fill-opacity="0.7">restates entity</text>
    <text x="470" y="22" font-weight="bold">owner map, expanded</text>
    <text x="632" y="22" fill-opacity="0.7">rejected</text>
    <text x="470" y="150" font-weight="bold">owner map, as written</text>
    <text x="640" y="150" fill-opacity="0.7">kept</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="47" font-weight="bold">entity</text>
      <text x="120" y="47" font-weight="bold">value</text>
      <text x="24" y="69">NULL</text>
      <text x="120" y="69">50</text>
      <text x="24" y="153" font-weight="bold">entity</text>
      <text x="24" y="175">gas</text>
      <text x="24" y="197">wind</text>
      <text x="24" y="219">solar</text>
      <text x="478" y="47" font-weight="bold">entity</text>
      <text x="590" y="47" font-weight="bold">layer</text>
      <text x="478" y="69">gas</text>
      <text x="590" y="69">parent</text>
      <text x="478" y="91">wind</text>
      <text x="590" y="91">parent</text>
      <text x="478" y="175" font-weight="bold">entity</text>
      <text x="590" y="175" font-weight="bold">layer</text>
      <text x="478" y="197">NULL</text>
      <text x="590" y="197">parent</text>
    </g>
    <text x="120" y="219" font-size="12" fill-opacity="0.7">added</text>
    <text x="478" y="119" font-size="12" font-style="italic">no row: solar came after the fold</text>
    <text x="478" y="224" font-size="12" fill-opacity="0.7">NULL covers gas, wind and solar</text>
    <text x="236" y="57" font-size="12" font-weight="bold">fold</text>
    <text x="268" y="57" font-size="12" fill-opacity="0.7">one row per label</text>
    <text x="312" y="185" font-size="12" font-weight="bold">fold</text>
    <text x="344" y="185" font-size="12" fill-opacity="0.7">map row as written</text>
    <text x="36" y="269" font-size="12">parent layer</text>
    <text x="156" y="269" font-size="12">child layer</text>
    <text x="276" y="269" font-size="12">owner map</text>
    <text x="396" y="269" font-size="12">no row</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="200" height="44" rx="3"/>
    <line x1="16" y1="54" x2="216" y2="54"/>
    <rect x="16" y="138" width="200" height="88" rx="3"/>
    <line x1="16" y1="160" x2="216" y2="160"/>
    <rect x="470" y="32" width="230" height="66" rx="3"/>
    <line x1="470" y1="54" x2="700" y2="54"/>
    <rect x="470" y="104" width="230" height="22" rx="3" stroke-dasharray="4 3"/>
    <rect x="470" y="160" width="230" height="44" rx="3"/>
    <line x1="470" y1="182" x2="700" y2="182"/>
    <rect x="16" y="258" width="14" height="14"/>
    <rect x="136" y="258" width="14" height="14"/>
    <rect x="256" y="258" width="14" height="14"/>
    <rect x="376" y="258" width="14" height="14" rx="2" stroke-dasharray="3 2"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#alk-arrow)">
    <path d="M216,65 H462"/>
    <path d="M300,65 V193 H462"/>
  </g>
</svg>
