<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" style="max-width: 100%; height: auto" role="img" aria-labelledby="ia-t ia-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="ia-t">A base record and two scenarios in one store, and one scenario read back</title>
  <desc id="ia-d">A schema declares the dimensions entity, bus and snapshot, and the attributes p_nom over entity, p_max_pu over entity and snapshot, and marginal_cost over entity. A commit writes the base revision into one store of parquet directories, with p_nom 100 for wind1 and 50 for gas1. Two scenarios branch from base and hold only the rows they change: high wind sets p_nom for wind1 to 150, and carbon price sets marginal_cost for gas1 to 80. Reading high wind returns one record with p_nom 150 for wind1 from high wind and 50 for gas1 from base. The PyPSA tool, pandas or polars, and DuckDB SQL read that record.</desc>
