<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" style="max-width: 100%; height: auto" role="img" aria-labelledby="ra-t ra-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="ra-t">Each axis resolves to the deepest file for it</title>
  <desc id="ra-d">The root layer holds dims/entity.parquet, with gas and wind and their ctype property, and dims/scenario.parquet, with low and high. The child layer restates the entity axis whole, as gas, wind and solar with their ctype, and holds no scenario file. The resolved entity axis is the child layer's file and the resolved scenario axis the root layer's: each resolved axis is the deepest file for it on the path from the root.</desc>
  <g stroke="none">
    <path d="M16,78 V59 A3,3 0 0 1 19,56 H213 A3,3 0 0 1 216,59 V78 Z" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="16" y="78" width="200" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,96 H216 V111 A3,3 0 0 1 213,114 H19 A3,3 0 0 1 16,111 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,172 V153 A3,3 0 0 1 19,150 H213 A3,3 0 0 1 216,153 V172 Z" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="16" y="172" width="200" height="18" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,190 H216 V205 A3,3 0 0 1 213,208 H19 A3,3 0 0 1 16,205 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M260,78 V59 A3,3 0 0 1 263,56 H457 A3,3 0 0 1 460,59 V78 Z" fill="#E69F00" fill-opacity="0.2"/>
    <rect x="260" y="78" width="200" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <rect x="260" y="96" width="200" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M260,114 H460 V129 A3,3 0 0 1 457,132 H263 A3,3 0 0 1 260,129 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M504,78 V59 A3,3 0 0 1 507,56 H701 A3,3 0 0 1 704,59 V78 Z" fill="currentColor" fill-opacity="0.1"/>
    <rect x="504" y="78" width="200" height="18" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M504,96 H704 V111 A3,3 0 0 1 701,114 H507 A3,3 0 0 1 504,111 Z" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="16" y="240" width="14" height="14" fill="#0072B2" fill-opacity="0.08"/>
    <rect x="136" y="240" width="14" height="14" fill="#E69F00" fill-opacity="0.08"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">root layer</text>
    <text x="260" y="22" font-weight="bold">child layer</text>
    <text x="504" y="22" font-weight="bold">resolved axes</text>
    <text x="16" y="48" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">dims/entity.parquet</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="24" y="71" font-weight="bold">entity</text>
    <text x="116" y="71" font-weight="bold">ctype</text>
    <text x="24" y="91">gas</text>
    <text x="116" y="91">generator</text>
    <text x="24" y="109">wind</text>
    <text x="116" y="109">generator</text>
    </g>
    <text x="16" y="142" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">dims/scenario.parquet</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="24" y="165" font-weight="bold">scenario</text>
    <text x="116" y="165" font-weight="bold"></text>
    <text x="24" y="185">low</text>
    <text x="116" y="185"></text>
    <text x="24" y="203">high</text>
    <text x="116" y="203"></text>
    </g>
    <text x="260" y="48" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">dims/entity.parquet</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="268" y="71" font-weight="bold">entity</text>
    <text x="360" y="71" font-weight="bold">ctype</text>
    <text x="268" y="91">gas</text>
    <text x="360" y="91">generator</text>
    <text x="268" y="109">wind</text>
    <text x="360" y="109">generator</text>
    <text x="268" y="127">solar</text>
    <text x="360" y="127">generator</text>
    </g>
    <text x="360" y="183" text-anchor="middle" font-size="12" fill-opacity="0.7">no scenario file</text>
    <text x="504" y="48" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"></text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
