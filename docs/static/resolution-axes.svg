    <rect x="504" y="56" width="200" height="58" rx="3"/>
    <path d="M504,78 H704"/>
    <rect x="16" y="240" width="14" height="14"/>
    <rect x="136" y="240" width="14" height="14"/>
    <rect x="266" y="240" width="14" height="14" stroke-dasharray="3 2"/>
  </g>
</svg>
