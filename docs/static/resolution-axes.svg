    <text x="512" y="91">entity</text>
    <text x="604" y="91">child</text>
    <text x="512" y="109">scenario</text>
    <text x="604" y="109">root</text>
    </g>
    <text x="260" y="226" font-size="12" fill-opacity="0.7">restates entity whole, adds solar</text>
    <text x="504" y="132" font-size="12" fill-opacity="0.7">each axis is the deepest file for it</text>
    <text x="36" y="251" font-size="12">root layer</text>
    <text x="156" y="251" font-size="12">child layer</text>
    <text x="286" y="251" font-size="12">absent: no file</text>
  </g>
