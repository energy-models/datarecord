  <title id="ra-t">Each axis resolves to the deepest file for it</title>
  <desc id="ra-d">The root layer contains dimensions/entity.parquet with gas and wind, and dimensions/scenario.parquet with low and high. The child layer restates the entity axis as gas, wind and solar, and has no scenario file. The resolved entity axis is the child's file and the resolved scenario axis is the root's.</desc>
