<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" style="max-width: 100%; height: auto" role="img" aria-labelledby="dm-t dm-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="dm-t">A multi-dimension's tuples, and a NULL struct that applies to each of them</title>
  <desc id="dm-d">The axis of the multi-dimension connection lists four tuples, each with the fields entity and bus: wind north, gas south, dc north and dc south. The attribute efficiency has a row with connection NULL and value 1.0, and a row at the tuple dc south with value 0.9. A row with entity dc and bus NULL matches no tuple, so no such row exists. Settled over the axis, the result has one row per tuple: dc south keeps 0.9 and the three other tuples take 1.0 from the NULL row.</desc>
  <defs>
    <marker id="dm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="dm-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <path d="M16,54 V35 A3,3 0 0 1 19,32 H213 A3,3 0 0 1 216,35 V54 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M16,54 H216 V72 H16 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,72 H216 V90 H16 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,90 H216 V108 H16 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,108 H216 V123 A3,3 0 0 1 213,126 H19 A3,3 0 0 1 16,123 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,198 V179 A3,3 0 0 1 19,176 H213 A3,3 0 0 1 216,179 V198 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M16,198 H216 V216 H16 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,216 H216 V231 A3,3 0 0 1 213,234 H19 A3,3 0 0 1 16,231 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M476,54 V35 A3,3 0 0 1 479,32 H693 A3,3 0 0 1 696,35 V54 Z" fill="#009E73" fill-opacity="0.2"/>
    <path d="M476,54 H696 V72 H476 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M476,72 H696 V90 H476 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M476,90 H696 V108 H476 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M476,108 H696 V123 A3,3 0 0 1 693,126 H479 A3,3 0 0 1 476,123 Z" fill="#009E73" fill-opacity="0.08"/>
    <rect x="476" y="180" width="14" height="14" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="476" y="204" width="14" height="14" fill="#009E73" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">axis</text>
    <text x="56" y="22" fill-opacity="0.75">connection, a struct of its fields</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="24" y="47" font-weight="bold">entity</text>
    <text x="106" y="47" font-weight="bold">bus</text>
    <text x="24" y="67">wind</text>
    <text x="106" y="67">north</text>
    <text x="24" y="85">gas</text>
    <text x="106" y="85">south</text>
    <text x="24" y="103">dc</text>
    <text x="106" y="103">north</text>
    <text x="24" y="121">dc</text>
    <text x="106" y="121">south</text>
    </g>
    <text x="16" y="166" font-weight="bold">attribute rows</text>
    <text x="142" y="166" fill-opacity="0.75">efficiency</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="24" y="191" font-weight="bold">connection</text>
    <text x="166" y="191" font-weight="bold">value</text>
    <text x="24" y="211">NULL</text>
    <text x="166" y="211">1.0</text>
    <text x="24" y="229">{dc, south}</text>
    <text x="166" y="229">0.9</text>
    </g>
    <text x="476" y="22" font-weight="bold">settled rows</text>
    <text x="586" y="22" fill-opacity="0.75">one per tuple</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="484" y="47" font-weight="bold">connection</text>
    <text x="636" y="47" font-weight="bold">value</text>
    <text x="484" y="67">{wind, north}</text>
    <text x="636" y="67">1.0</text>
    <text x="484" y="85">{gas, south}</text>
    <text x="636" y="85">1.0</text>
    <text x="484" y="103">{dc, north}</text>
    <text x="636" y="103">1.0</text>
    <text x="484" y="121">{dc, south}</text>
    <text x="636" y="121">0.9</text>
    </g>
    <text x="24" y="259" font-size="12" font-style="italic" fill-opacity="0.75">no row: {dc, NULL} is no tuple</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="200" height="94" rx="3"/>
    <line x1="16" y1="54" x2="216" y2="54"/>
    <rect x="16" y="176" width="200" height="58" rx="3"/>
    <line x1="16" y1="198" x2="216" y2="198"/>
    <rect x="476" y="32" width="220" height="94" rx="3"/>
    <line x1="476" y1="54" x2="696" y2="54"/>
    <rect x="16" y="244" width="200" height="22" rx="6" stroke-dasharray="4 3"/>
    <path d="M216,207 H300 V100"/>
    <rect x="476" y="180" width="14" height="14"/>
    <rect x="476" y="204" width="14" height="14"/>
    <rect x="476" y="228" width="14" height="14" stroke-dasharray="4 3"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#dm-arrow)">
    <path d="M216,80 H300 V100 H468"/>
  </g>
  <g fill="currentColor">
    <text x="312" y="124" font-size="12" font-weight="bold">settle</text>
    <text x="312" y="140" font-size="12" fill-opacity="0.75">a NULL struct takes</text>
    <text x="312" y="156" font-size="12" fill-opacity="0.75">every tuple</text>
    <text x="496" y="191" font-size="12">axis and rows given</text>
    <text x="496" y="215" font-size="12">settled rows</text>
    <text x="496" y="239" font-size="12">no row</text>
  </g>
</svg>
