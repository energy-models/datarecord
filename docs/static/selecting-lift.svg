<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" style="max-width: 100%; height: auto" role="img" aria-labelledby="sl-t sl-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="sl-t">lift puts the squeezed labels back on rows written over the view</title>
  <desc id="sl-d">With view equal to record.select(scenario="high", period=2030), price rows over the view hold bus, snapshot and value: b1 with snapshot timestep t0 at 10, and b2 with snapshot timestep t0 at 12. view.lift of price adds period 2030 back into the snapshot struct and the scenario column at high, in the base's column order: bus, snapshot, scenario, value.</desc>
  <defs>
    <marker id="sl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="none">
    <path d="M16,84 V65 A3,3 0 0 1 19,62 H273 A3,3 0 0 1 276,65 V84 Z" fill="currentColor" fill-opacity="0.1"/>
    <path d="M16,214 V195 A3,3 0 0 1 19,192 H447 A3,3 0 0 1 450,195 V214 Z" fill="currentColor" fill-opacity="0.1"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">view = record.select(scenario="high", period=2030)</text>
    <text x="16" y="52" font-weight="bold">rows over the view</text>
    <text x="152" y="52" fill-opacity="0.7">price</text>
    <text x="16" y="182" font-weight="bold">view.lift</text>
    <text x="84" y="182" fill-opacity="0.7">price over the base</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="76" font-weight="bold">bus</text>
      <text x="70" y="76" font-weight="bold">snapshot</text>
      <text x="214" y="76" font-weight="bold">value</text>
      <text x="24" y="98">b1</text>
      <text x="70" y="98">{timestep: t0}</text>
      <text x="214" y="98">10</text>
      <text x="24" y="116">b2</text>
      <text x="70" y="116">{timestep: t0}</text>
      <text x="214" y="116">12</text>
      <text x="24" y="206" font-weight="bold">bus</text>
      <text x="70" y="206" font-weight="bold">snapshot</text>
      <text x="300" y="206" font-weight="bold">scenario</text>
      <text x="388" y="206" font-weight="bold">value</text>
      <text x="24" y="228">b1</text>
      <text x="70" y="228">{period: 2030, timestep: t0}</text>
      <text x="300" y="228">high</text>
      <text x="388" y="228">10</text>
      <text x="24" y="246">b2</text>
      <text x="70" y="246">{period: 2030, timestep: t0}</text>
      <text x="300" y="246">high</text>
      <text x="388" y="246">12</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="62" width="260" height="62" rx="3"/>
    <line x1="16" y1="84" x2="276" y2="84"/>
    <rect x="16" y="192" width="434" height="62" rx="3"/>
    <line x1="16" y1="214" x2="450" y2="214"/>
    <path d="M78,260 V266 H163 V260"/>
    <path d="M300,260 V266 H358 V260"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#sl-arrow)">
    <path d="M276,93 H400 V184"/>
  </g>
  <g fill="currentColor">
    <text x="410" y="130" font-size="12" font-weight="bold">lift</text>
    <text x="410" y="145" font-size="12" fill-opacity="0.7">from labels and</text>
    <text x="410" y="160" font-size="12" fill-opacity="0.7">base.schema</text>
    <text x="78" y="282" font-size="12" fill-opacity="0.7">period = 2030</text>
    <text x="300" y="282" font-size="12" fill-opacity="0.7">scenario = high</text>
  </g>
</svg>
