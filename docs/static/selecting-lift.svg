<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" width="780" height="170" style="max-width: 100%; height: auto" role="img" aria-labelledby="sl-t sl-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="sl-t">lift puts the squeezed label back</title>
  <desc id="sl-d">Rows of p_max_pu over a selection that squeezed snapshot at 1 have the columns entity and value: wind 0.8 and NULL 1.0. lift adds the snapshot column at the label 1, so the rows read wind 1 0.8 and NULL 1 1.0.</desc>
  <defs>
    <marker id="sl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
    <pattern id="sl-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-opacity="0.65" stroke-width="3.5"/>
    </pattern>
  </defs>
  <g stroke="none">
    <path d="M16,54 V35 A3,3 0 0 1 19,32 H213 A3,3 0 0 1 216,35 V54 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M16,54 H216 V72 H16 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,72 H216 V87 A3,3 0 0 1 213,90 H19 A3,3 0 0 1 16,87 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M476,54 V35 A3,3 0 0 1 479,32 H673 A3,3 0 0 1 676,35 V54 Z" fill="#009E73" fill-opacity="0.2"/>
    <path d="M476,54 H676 V72 H476 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M476,72 H676 V87 A3,3 0 0 1 673,90 H479 A3,3 0 0 1 476,87 Z" fill="#009E73" fill-opacity="0.08"/>
    <rect x="16" y="110" width="14" height="14" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="16" y="134" width="14" height="14" fill="#009E73" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">rows over the selection</text>
    <text x="230" y="22" fill-opacity="0.75">p_max_pu</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="24" y="47" font-weight="bold">entity</text>
    <text x="166" y="47" font-weight="bold">value</text>
    <text x="24" y="67">wind</text>
    <text x="166" y="67">0.8</text>
    <text x="24" y="85">NULL</text>
    <text x="166" y="85">1.0</text>
    </g>
    <text x="476" y="22" font-weight="bold">lifted rows</text>
    <text x="578" y="22" fill-opacity="0.75">p_max_pu</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="484" y="47" font-weight="bold">entity</text>
    <text x="548" y="47" font-weight="bold">snapshot</text>
    <text x="626" y="47" font-weight="bold">value</text>
    <text x="484" y="67">wind</text>
    <text x="548" y="67">1</text>
    <text x="626" y="67">0.8</text>
    <text x="484" y="85">NULL</text>
    <text x="548" y="85">1</text>
    <text x="626" y="85">1.0</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="32" width="200" height="58" rx="3"/>
    <line x1="16" y1="54" x2="216" y2="54"/>
    <rect x="476" y="32" width="200" height="58" rx="3"/>
    <line x1="476" y1="54" x2="676" y2="54"/>
    <rect x="16" y="110" width="14" height="14"/>
    <rect x="16" y="134" width="14" height="14"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#sl-arrow)">
    <path d="M216,63 H468"/>
  </g>
  <g fill="currentColor">
    <text x="300" y="37" font-size="12" font-weight="bold">lift</text>
    <text x="300" y="53" font-size="12" fill-opacity="0.75">add snapshot = 1</text>
    <text x="36" y="121" font-size="12">rows given</text>
    <text x="36" y="145" font-size="12">lifted rows</text>
  </g>
</svg>
