[workspace]
name = "datarecord"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
preview = ["pixi-build"]

[package]
name = "datarecord"
[package.build.backend]
name = "pixi-build-python"
version = "*"
[package.host-dependencies]
python = ">=3.11"
hatchling = "*"
uv = "*"

[dependencies]
datarecord = { path = "." }
duckdb = ">=1.5.4,<2"
narwhals = ">=2,<3"
pydantic = ">=2"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
mypy = "*"
pandas = "*"
pyarrow = "*"
[feature.test.tasks]
test = "pytest"
test-coverage = "pytest --cov=datarecord --cov-report=xml --cov-report=term-missing"

# `datarecord.tools.pypsa` is an optional extra (§13: no tool import may leak
# into core datarecord), so its tests get their own feature/environment
# rather than being installed by default.
[feature.pypsa.dependencies]
pypsa = "*"

[feature.build.dependencies]
python = "*"
hatchling = "*"
python-build = "*"
twine = ">=6"
[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
lefthook = "*"
ruff = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"
reuse = "*"
[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.py311.dependencies]
python = "3.11.*"
[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test", "build", "lint"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
pypsa = ["test", "pypsa"]
