[workspace]
name = "datarecord"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
preview = ["pixi-build"]

[package]
name = "datarecord"
[package.build.backend]
name = "pixi-build-python"
version = "*"
[package.host-dependencies]
python = ">=3.12"
hatchling = "*"
uv = "*"

[dependencies]
datarecord = { path = "." }
duckdb = ">=2.0,<3"
pydantic = ">=2.12"

[pypi-dependencies]
mathspec = { git = "https://github.com/energy-models/mathspec.git", rev = "8982c556114992d149a83b3c6f3604c72e569829" }

[exclude-newer]
# DuckDB 2.0 is younger than the 7d cooldown; drop once it has aged past it.
duckdb = "0d"
python-duckdb = "0d"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
mypy = "*"
pandas = "*"
pyarrow = "*"
pypsa = "*"
boto3 = ">=1.35.69"
[feature.test.tasks]
test = "pytest"
test-coverage = "pytest --cov=datarecord --cov-report=xml --cov-report=term-missing"

# `datarecord.tools.pypsa` is an optional extra (no tool import may leak into
# core datarecord); kept as its own feature/environment too, as a model
# for integrating further tools, even though `test` now pulls it in directly.
[feature.pypsa.dependencies]
pypsa = "*"

# The published site. Its own feature, not `test`: nothing in the suite imports
# any of it, and a contributor running `pixi run test` should not pay for a docs
# toolchain. mkdocstrings imports `datarecord` to read its docstrings, so the
# environment carries the package itself.
#
# Built with ProperDocs, the maintained continuation of MkDocs 1.x, which runs
# the same plugins unchanged. MkDocs itself is unmaintained, and its 2.0 drops
# the plugin system - it would take mkdocstrings, and so the whole API
# Reference, with it. Zensical, Material's successor, still calls its
# mkdocstrings integration preliminary, so this stays here until that settles.
[feature.docs.dependencies]
properdocs = ">=1.6.7,<2"
mkdocs-material = ">=9.5,<10"
mkdocstrings-python = ">=1.10"
mkdocs-redirects = ">=1.2"
# mkdocstrings formats signatures with one of these; without it every signature
# renders on a single unwrapped line.
ruff = "*"
# rsvg-convert, to look at a figure in both themes before it lands.
librsvg = "*"
[feature.docs.tasks]
docs = "properdocs serve -f mkdocs.yml"
docs-build = "properdocs build --strict -f mkdocs.yml"

# Material prints a red MkDocs 2.0 advisory on every build. It is editorial, not
# a deprecation of anything used here, and in a CI log it reads as a failure -
# which matters because `--strict` means a real problem is also red.
[feature.docs.activation.env]
NO_MKDOCS_2_WARNING = "1"

[feature.build.dependencies]
python = "*"
hatchling = "*"
python-build = "*"
twine = ">=6"
[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
lefthook = "*"
ruff = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"
reuse = "*"
[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test", "build", "lint"]
docs = ["docs"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
pypsa = ["test", "pypsa"]
