# DuckDB is capped at the newest release the suite passed on, since `register`
# calls its private `_create_view` and `_render`. Renovate raises the cap in
# both manifests once a release is 7 days old, as `renovate.json5` sets out.
# It runs under an app token, so its pull request starts `ci.yml`; a pull
# request opened with GITHUB_TOKEN would start no workflow.
name: Renovate
permissions: {}

on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 * * *

jobs:
  renovate:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Create the app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          permission-checks: read
      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["pixi"]'
          RENOVATE_ALLOWED_COMMANDS: '["^pixi update --no-install duckdb python-duckdb$"]'
        run: npx --yes renovate@44.198.0
