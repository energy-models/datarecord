# DuckDB is capped at the newest release the suite passed on, since `register`
# calls its private `_create_view` and `_render`. This raises the cap to the
# newest release once the suite passes on it. The suite runs here: a pull request opened with GITHUB_TOKEN starts no
# other workflow.
name: Bump DuckDB
permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 1 * *

jobs:
  bump:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - name: Cap DuckDB at the newest release
        id: pin
        run: |
          old=$(sed -nE 's/^duckdb = ">=[^,]+,<=(.+)"$/\1/p' pixi.toml)
          sed -i -E 's/^(duckdb = ">=[^,"]+),<=[^"]+"$/\1"/' pixi.toml
          sed -i -E 's/"(duckdb>=[^,"]+),<=[^"]+"/"\1"/' pyproject.toml
          pixi update --no-install duckdb python-duckdb
          new=$(grep -oP 'noarch/duckdb-\K[0-9][0-9.]*(?=-)' pixi.lock | sort -uV | tail -1)
          sed -i -E "s/^(duckdb = \">=[^,\"]+)\"$/\1,<=${new}\"/" pixi.toml
          sed -i -E "s/\"(duckdb>=[^,\"]+)\"/\"\1,<=${new}\"/" pyproject.toml
          pixi lock
          echo "old=${old}" >> "$GITHUB_OUTPUT"
          echo "new=${new}" >> "$GITHUB_OUTPUT"
      - name: Run the tests on the new DuckDB
        if: steps.pin.outputs.new != steps.pin.outputs.old
        run: pixi run test --numprocesses=auto
      - name: Create pull request
        if: steps.pin.outputs.new != steps.pin.outputs.old
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "build: cap DuckDB at ${{ steps.pin.outputs.new }}"
          title: "build: cap DuckDB at ${{ steps.pin.outputs.new }}"
          body: |
            Raises the DuckDB cap from ${{ steps.pin.outputs.old }} to ${{ steps.pin.outputs.new }}.
            The test suite passed on it in the run that opened this pull request.
          branch: bump-duckdb
          base: main
          labels: dependencies
          delete-branch: true
          add-paths: |
            pixi.toml
            pyproject.toml
            pixi.lock
