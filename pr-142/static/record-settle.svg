  </g>
  <g fill="currentColor">
    <text x="16" y="22" font-weight="bold">attribute rows</text>
    <text x="142" y="22" fill-opacity="0.75">p_max_pu</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="24" y="47" font-weight="bold">entity</text>
    <text x="88" y="47" font-weight="bold">snapshot</text>
