  <g fill="currentColor">
    <text x="262" y="124" font-size="12" font-weight="bold">settle</text>
    <text x="262" y="140" font-size="12" fill-opacity="0.75">NULL entity takes wind and gas,</text>
    <text x="262" y="156" font-size="12" fill-opacity="0.75">snapshot stays as written</text>
    <text x="684" y="67" font-size="12">from NULL row</text>
