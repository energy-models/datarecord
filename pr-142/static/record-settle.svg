<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" style="max-width: 100%; height: auto" role="img" aria-labelledby="rs-t rs-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="rs-t">Settling p_max_pu over the generators</title>
  <desc id="rs-d">The attribute p_max_pu has rows for wind at snapshots 0, 1 and 2 with 0.3, 0.8 and 0.5, and one row with entity and snapshot NULL and value 1.0. settle takes labels for entity alone, the generators wind and gas. The NULL row expands over them, so gas and wind each get a row at snapshot NULL with 1.0. snapshot is not in labels, so it stays as written: wind keeps its series beside its row at snapshot NULL. dc is no generator, so it has no row.</desc>
