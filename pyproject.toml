[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "LICENSES", "README.md"]

[project]
name = "datarecord"
description = "Dimensioned attribute data with a declared schema"
authors = [
  { name = "Jonas Hörsch", email = "jonas.hoersch@openenergytransition.org" },
]
license = "MIT"
license-files = ["LICENSE"]
# replaced in CI
version = "0.0.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["duckdb>=1.5.4", "narwhals>=2,<3", "pydantic>=2"]

[project.optional-dependencies]
pypsa = ["pypsa"]

[project.urls]
repository = "https://github.com/energy-models/datarecord"

[project.scripts]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
  "N803", # https://docs.astral.sh/ruff/rules/invalid-argument-name
  "N806", # https://docs.astral.sh/ruff/rules/non-lowercase-variable-in-function
  "N813", # deliberate: col/lit/star/sql/coalesce read as SQL, not classes
  "E501", # https://docs.astral.sh/ruff/faq/#is-the-ruff-linter-compatible-with-black
]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pep8-naming
  "N",
  # pyupgrade
  "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = '3.12'
no_implicit_optional = true
check_untyped_defs = true
files = "src/"

# pandas ships no stubs.
[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running checks (large fixtures); deselect with -m \"not slow\"",
]
addopts = '-m "not slow"'

[tool.coverage.run]
branch = true
source = ["src/"]
